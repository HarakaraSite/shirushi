name: Release (latest)

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-linux-amd64  .
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-linux-arm64  .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-darwin-arm64 .

      - name: Delete existing latest release and tag
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ vars.FORGE_URL }}/api/v1/repos/${{ github.repository }}/releases/tags/latest" || true
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ vars.FORGE_URL }}/api/v1/repos/${{ github.repository }}/git/refs/tags/latest" || true

      - name: Upload release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ vars.FORGE_URL }}
          repo: ${{ github.repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: latest
          release-dir: dist
          release-notes: "Latest build from main (${{ github.sha }})"
          prerelease: true
