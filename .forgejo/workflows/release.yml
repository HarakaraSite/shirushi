name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-linux-amd64  .
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-linux-arm64  .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w" -trimpath -o dist/shirushi-darwin-arm64 .

      # バージョンタグでリリース（タグSHA=ビルドSHAなので不一致は起きない）
      - name: Upload versioned release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ vars.FORGE_URL }}
          repo: ${{ github.repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: dist
          release-notes: "Release ${{ github.ref_name }}"

      # latestを更新（上書きのため既存リリース・タグを削除）
      - name: Delete existing latest release and tag
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ vars.FORGE_URL }}/api/v1/repos/${{ github.repository }}/releases/tags/latest" \
            | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              "${{ vars.FORGE_URL }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ vars.FORGE_URL }}/api/v1/repos/${{ github.repository }}/git/refs/tags/latest" || true
          sleep 2

      - name: Upload latest release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ vars.FORGE_URL }}
          repo: ${{ github.repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: latest
          release-dir: dist
          release-notes: "Latest build (${{ github.ref_name }})"
          prerelease: true
