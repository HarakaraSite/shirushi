version: 2

runner_label: ubuntu-latest
actions:
  checkout: actions/checkout@v4
  setup_go: actions/setup-go@v5
  release: actions/forgejo-release@v2

release:
  uploader_kind: forgejo-release-v2-public
  url_expression: ${{ forgejo.server_url }}
  repository_expression: ${{ forgejo.repository }}
  token_expression: ${{ forgejo.token }}
  tag_expression: ${{ forgejo.ref_name }}
  notes_expression: ${{ format('Release {0}', forgejo.ref_name) }}

build:
  product: shirushi
  package: .
  cgo_enabled: false
  ldflags: -s -w
  targets:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64

quality:
  test_command: CGO_ENABLED=0 go test ./...
  vet_command: go vet ./...
  checksums: true

diagnostics:
  mode: native-actions-logs

pre_release:
  reference_environment: Debian development environment with repository-local Playwright Test and shared managed Firefox and Chromium browsers
  reference_checks:
    - name: login-visual-regression
      command: npm run test:e2e:firefox
    - name: bookmark-404-browser-e2e
      command: TODO migrate the bookmark 404 scenario to Playwright Test
  evidence_location: docs/release-checkpoints.md
