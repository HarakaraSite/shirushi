<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shirushi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
    }

    /* 登録フォームのスタイル */
    form {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input, textarea {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      width: 100%;
    }

    button {
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      align-self: flex-start;
    }

    button:hover {
      background: #555;
    }

    /* タグ入力エリアのスタイル */
    .tag-input-area {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      cursor: text;
      position: relative;
    }

    .tag-input-area input {
      border: none;
      outline: none;
      padding: 2px 0;
      font-size: 0.875rem;
      width: 120px;
      flex-grow: 1;
    }

    /* 選択済みタグのバッジ（フォーム内） */
    .tag-selected-badge {
      background: #e8f0fe;
      color: #1a56db;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag-selected-badge button {
      background: none;
      color: #1a56db;
      border: none;
      padding: 0;
      font-size: 0.9rem;
      cursor: pointer;
      line-height: 1;
      align-self: auto;
    }

    /* ドロップダウン候補リストのスタイル */
    .tag-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 2px;
      z-index: 10;
      max-height: 160px;
      overflow-y: auto;
    }

    .tag-dropdown-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.875rem;
    }

    .tag-dropdown-item:hover {
      background: #f0f4ff;
    }

    /* ブックマーク一覧のスタイル */
    #bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bookmark-item {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .bookmark-info a {
      font-size: 1rem;
      font-weight: bold;
      color: #0070f3;
      text-decoration: none;
    }

    .bookmark-info a:hover {
      text-decoration: underline;
    }

    .bookmark-info .author {
      font-size: 0.875rem;
      color: #888;
      margin-top: 2px;
    }

    .bookmark-info .description {
      font-size: 0.875rem;
      color: #666;
      margin-top: 4px;
    }

    /* タグバッジのスタイル */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .tag-badge {
      background: #e8f0fe;
      color: #1a56db;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .bookmark-info .date {
      font-size: 0.75rem;
      color: #999;
      margin-top: 6px;
    }

    .delete-btn {
      background: #e00;
      flex-shrink: 0;
      padding: 4px 12px;
      font-size: 0.875rem;
    }

    .delete-btn:hover {
      background: #c00;
    }
  </style>
</head>
<body>
  <!-- ログイン画面（未認証のときだけ表示） -->
  <div id="login-screen" style="display:none; max-width:320px; margin:80px auto;">
    <h1 style="margin-bottom:24px;">Shirushi</h1>
    <form id="login-form" style="background:#fff; padding:16px; border-radius:8px; display:flex; flex-direction:column; gap:8px;">
      <input type="password" id="input-password" placeholder="パスワード" required>
      <button type="submit">ログイン</button>
      <p id="login-error" style="color:#e00; font-size:0.875rem; display:none;">パスワードが違います</p>
    </form>
  </div>

  <!-- メイン画面（認証済みのときだけ表示） -->
  <div id="main-screen" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="margin-bottom:0;">Shirushi</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <a href="/api/export" download="shirushi-bookmarks.html">
          <button type="button">エクスポート</button>
        </a>
        <label style="cursor:pointer;">
          <button type="button" onclick="this.parentElement.querySelector('input').click()">インポート</button>
          <input type="file" accept=".html" style="display:none;" onchange="importBookmarks(this)">
        </label>
        <button type="button" onclick="logout()" style="background:#888;">ログアウト</button>
      </div>
    </div>

    <!-- 登録フォーム -->
    <form id="bookmark-form">
    <input type="url" id="input-url" placeholder="URL（必須）" required>
    <input type="text" id="input-title" placeholder="タイトル">
    <input type="text" id="input-author" placeholder="著者">
    <textarea id="input-excerpt" placeholder="メモ・抜粋" rows="2"></textarea>
    <!-- タグ入力エリア（オートコンプリート方式） -->
    <div class="tag-input-area" id="tag-input-area" onclick="document.getElementById('tag-input').focus()">
      <!-- 選択済みタグのバッジがここに追加されます -->
      <input type="text" id="tag-input" placeholder="タグを入力..." autocomplete="off">
      <!-- ドロップダウン候補リスト -->
      <div class="tag-dropdown" id="tag-dropdown" style="display:none;"></div>
    </div>
    <button type="submit">登録</button>
  </form>

    <!-- 登録フォームとブックマーク一覧はメイン画面の中に入ります -->
    <!-- ブックマーク一覧 -->
    <div id="bookmark-list">
      <p>読み込み中...</p>
    </div>
  </div> <!-- #main-screen ここまで -->

  <script>
    let allTags = [];
    let selectedTags = [];

    // ページ読み込み時に認証状態を確認します。
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
    });

    // GET /api/bookmarks で認証状態を確認します。
    // 401が返ればログイン画面を、200ならメイン画面を表示します。
    async function checkAuth() {
      const res = await fetch('/api/bookmarks');
      if (res.status === 401) {
        showLoginScreen();
      } else {
        showMainScreen();
      }
    }

    function showLoginScreen() {
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('main-screen').style.display = 'none';
    }

    async function showMainScreen() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      await loadTags();
      await loadBookmarks();
      setupTagInput();
    }

    // ログインフォームの送信処理です。
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('input-password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        document.getElementById('input-password').value = '';
        document.getElementById('login-error').style.display = 'none';
        showMainScreen();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    });

    // ログアウト処理です。
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      showLoginScreen();
    }

    // GET /api/tags：タグ一覧を取得してメモリに保持します。
    async function loadTags() {
      const res = await fetch('/api/tags');
      allTags = await res.json() ?? [];
    }

    // GET /api/bookmarks：ブックマーク一覧を取得して画面に表示します。
    async function loadBookmarks() {
      const list = document.getElementById('bookmark-list');
      const res = await fetch('/api/bookmarks');
      const bookmarks = await res.json();

      if (bookmarks === null || bookmarks.length === 0) {
        list.innerHTML = '<p>ブックマークはまだありません。</p>';
        return;
      }

      list.innerHTML = bookmarks.map(b => `
        <div class="bookmark-item" data-id="${b.id}">
          <div class="bookmark-info">
            <a href="${b.url}" target="_blank" rel="noopener">${b.title || b.url}</a>
            ${b.author ? `<div class="author">${b.author}</div>` : ''}
            ${b.excerpt ? `<div class="description">${b.excerpt}</div>` : ''}
            ${b.tags && b.tags.length > 0 ? `
              <div class="tag-list">
                ${b.tags.map(t => `<span class="tag-badge">${t.name}</span>`).join('')}
              </div>
            ` : ''}
            <div class="date">${new Date(b.created_at).toLocaleDateString('ja-JP')}</div>
          </div>
          <button class="delete-btn" onclick="deleteBookmark(${b.id})">削除</button>
        </div>
      `).join('');
    }

    // タグ入力のオートコンプリート機能をセットアップします。
    function setupTagInput() {
      const input    = document.getElementById('tag-input');
      const dropdown = document.getElementById('tag-dropdown');

      // 入力のたびに候補を絞り込んでドロップダウンに表示します。
      input.addEventListener('input', () => {
        const query = input.value.trim().toLowerCase();

        // 入力が空なら候補を閉じます。
        if (!query) {
          dropdown.style.display = 'none';
          return;
        }

        // 入力に部分一致するタグを絞り込みます。
        // すでに選択済みのタグは候補から除外します。
        const selectedIds = selectedTags.map(t => t.id);
        const filtered = allTags.filter(t =>
          t.name.toLowerCase().includes(query) && !selectedIds.includes(t.id)
        );

        if (filtered.length === 0) {
          dropdown.style.display = 'none';
          return;
        }

        // 候補をドロップダウンに表示します。
        dropdown.innerHTML = filtered.map(t =>
          `<div class="tag-dropdown-item" onclick="selectTag(${t.id}, '${t.name}')">${t.name}</div>`
        ).join('');
        dropdown.style.display = 'block';
      });

      // 入力欄の外をクリックしたらドロップダウンを閉じます。
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#tag-input-area')) {
          dropdown.style.display = 'none';
        }
      });
    }

    // タグを選択したときの処理です。バッジを追加して入力欄をクリアします。
    function selectTag(id, name) {
      selectedTags.push({ id, name });
      renderSelectedTags();
      document.getElementById('tag-input').value = '';
      document.getElementById('tag-dropdown').style.display = 'none';
    }

    // 選択済みタグのバッジを再描画します。
    function renderSelectedTags() {
      const area  = document.getElementById('tag-input-area');
      const input = document.getElementById('tag-input');

      // 既存のバッジを削除してから再生成します。
      area.querySelectorAll('.tag-selected-badge').forEach(el => el.remove());

      // 選択済みタグのバッジを input の前に挿入します。
      selectedTags.forEach(t => {
        const badge = document.createElement('span');
        badge.className = 'tag-selected-badge';
        badge.innerHTML = `${t.name}<button type="button" onclick="removeTag(${t.id})">×</button>`;
        area.insertBefore(badge, input);
      });
    }

    // バッジの × ボタンで選択済みタグを取り消します。
    function removeTag(id) {
      selectedTags = selectedTags.filter(t => t.id !== id);
      renderSelectedTags();
    }

    // POST /api/fetch-metadata：URLからメタデータを自動取得してフォームに入力します。
    document.getElementById('input-url').addEventListener('blur', async () => {
      const url = document.getElementById('input-url').value.trim();
      if (!url) return;

      // タイトルがすでに入力済みの場合は上書きしません。
      const titleInput = document.getElementById('input-title');
      if (titleInput.value.trim()) return;

      // 取得中であることをプレースホルダーで伝えます。
      titleInput.placeholder = '取得中...';

      const res = await fetch('/api/fetch-metadata', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      titleInput.placeholder = 'タイトル';
      if (!res.ok) return;

      const meta = await res.json();
      // 各フィールドが空のときだけ自動入力します（手入力を上書きしない）。
      if (meta.title   && !titleInput.value)
        titleInput.value = meta.title;
      if (meta.excerpt && !document.getElementById('input-excerpt').value)
        document.getElementById('input-excerpt').value = meta.excerpt;
      if (meta.author  && !document.getElementById('input-author').value)
        document.getElementById('input-author').value = meta.author;
    });

    // POST /api/bookmarks：フォームの内容を送信して新しいブックマークを登録します。
    document.getElementById('bookmark-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const url     = document.getElementById('input-url').value;
      const title   = document.getElementById('input-title').value;
      const author  = document.getElementById('input-author').value;
      const excerpt = document.getElementById('input-excerpt').value;
      // selectedTags をそのまま送信します（[{id, name}, ...]）。
      const tags = selectedTags.map(t => ({ id: t.id }));

      const res = await fetch('/api/bookmarks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, title, author, excerpt, tags }),
      });

      if (res.ok) {
        e.target.reset();
        selectedTags = [];
        renderSelectedTags();
        loadBookmarks();
      } else {
        alert('登録に失敗しました');
      }
    });

    // POST /api/import：Netscape Bookmark形式のHTMLファイルをアップロードしてインポートします。
    async function importBookmarks(input) {
      const file = input.files[0];
      if (!file) return;

      // FormData はファイルをmultipart/form-data形式で送るための標準APIです。
      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch('/api/import', { method: 'POST', body: formData });

      if (res.ok) {
        const result = await res.json();
        alert(`インポート完了: ${result.imported}件追加、${result.skipped}件スキップ`);
        loadBookmarks();
      } else {
        alert('インポートに失敗しました');
      }
      // 同じファイルを再選択できるようにリセットします。
      input.value = '';
    }

    // DELETE /api/bookmarks/:id：指定したIDのブックマークを削除する関数です。
    async function deleteBookmark(id) {
      if (!confirm('削除しますか？')) return;
      const res = await fetch(`/api/bookmarks/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadBookmarks();
      } else {
        alert('削除に失敗しました');
      }
    }
  </script>
</body>
</html>
