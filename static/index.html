<!DOCTYPE html>
<!-- data-theme="dark"：Pico CSS をダークテーマに固定します。
     これがないと OS のライト/ダーク設定によって Pico のライト用変数
     （:root:not([data-theme=dark]) という高詳細度セレクタ）が
     style.css の :root 上書きに勝ってしまい、ライトモードのOSで表示が崩れます。 -->
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shirushi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Pico CSS classless: セマンティックHTMLにクラスなしでスタイルが当たります。
       go:embed でバイナリに同梱しているため、オフライン環境でも動作します。 -->
  <link rel="stylesheet" href="/css/pico.min.css">
  <!-- アプリ固有のスタイル -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== ログイン画面 ===== -->
  <div id="login-screen" style="display:none; max-width:320px; margin:80px auto;">
    <h1 style="margin-bottom:24px;">Shirushi</h1>
    <form id="login-form" style="background:#fff; padding:16px; border-radius:8px; display:flex; flex-direction:column; gap:8px;">
      <input type="text" name="username" value="shirushi" autocomplete="username" hidden>
      <input type="password" id="input-password" placeholder="パスワード" autocomplete="current-password" required>
      <button type="submit">ログイン</button>
      <p id="login-error" style="color:#e00; font-size:0.875rem; display:none;">パスワードが違います</p>
    </form>
  </div>

  <!-- ===== メイン画面 ===== -->
  <div id="main-screen" style="display:none;">

    <!-- ヘッダー -->
    <div class="main-header">
      <h1>Shirushi</h1>
      <div class="header-actions">
        <!-- 追加ボタン：クリックでモーダルを「追加モード」で開く -->
        <button type="button" onclick="openModal()">＋ 追加</button>
        <!-- エクスポート：<a>の中に<button>を入れるのはHTML仕様違反
             （インタラクティブ要素の入れ子）のため、<a>自体をボタン風に装飾します -->
        <a href="/api/export" download="shirushi-bookmarks.html" class="header-btn">エクスポート</a>
        <!-- インポート：非表示のファイル入力をボタンから開く方式です -->
        <button type="button" onclick="document.getElementById('import-file').click()">インポート</button>
        <input type="file" id="import-file" accept=".html" style="display:none;" onchange="importBookmarks(this)">
        <button type="button" onclick="openTagManager()">タグ管理</button>
        <button type="button" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <!-- 検索バー -->
    <input
      type="search"
      id="search-input"
      placeholder="タイトル・URL・メモで検索..."
      style="width:100%; margin-bottom:16px;"
    >

    <!-- タグフィルターチップ（タグがあるときだけ表示） -->
    <div id="tag-filter-area" style="display:none;"></div>

    <!-- バッチ操作バー（1件以上選択したときだけ表示） -->
    <div id="bulk-bar">
      <span id="bulk-count">0件選択中</span>

      <!-- タグ追加ボタン＋ドロップダウン（相対配置のwrapperで包みます） -->
      <div id="bulk-tag-dropdown-wrapper">
        <button type="button" id="bulk-tag-btn" onclick="toggleBulkTagDropdown()">＋ タグを追加</button>
        <!-- タグ追加ドロップダウン -->
        <div id="bulk-tag-dropdown" style="display:none;">
          <input type="text" class="bulk-tag-search-input" id="bulk-tag-input"
            placeholder="タグ名を入力… Enter で作成" autocomplete="off">
          <div class="bulk-tag-list" id="bulk-tag-list"></div>
        </div>
      </div>

      <!-- タグ削除ボタン＋ドロップダウン -->
      <div id="bulk-tag-remove-dropdown-wrapper" style="position:relative;">
        <button type="button" id="bulk-tag-remove-btn" onclick="toggleBulkTagRemoveDropdown()">－ タグを削除</button>
        <div id="bulk-tag-remove-dropdown" style="display:none;">
          <input type="text" class="bulk-tag-search-input" id="bulk-tag-remove-input"
            placeholder="タグ名で絞り込み…" autocomplete="off">
          <div class="bulk-tag-list" id="bulk-tag-remove-list"></div>
        </div>
      </div>

      <button type="button" onclick="selectAll()">全て選択</button>
      <button type="button" onclick="bulkDelete()">一括削除</button>
      <button type="button" class="bulk-cancel" onclick="clearSelection()" style="background:transparent; color:#fff; padding:4px 8px;">✕ 選択解除</button>
    </div>

    <!-- ブックマーク一覧 -->
    <div id="bookmark-list">
      <p>読み込み中...</p>
    </div>

    <!-- ページネーション -->
    <div id="pagination"></div>

  </div><!-- #main-screen ここまで -->

  <!-- ===== モーダル（追加・編集の両方に使い回す） ===== -->
  <!-- オーバーレイをクリックしたらモーダルを閉じる -->
  <div id="modal-overlay" onclick="onOverlayClick(event)">
    <div id="modal-box">
      <!-- モードに応じてタイトルが変わる -->
      <h2 id="modal-heading">ブックマークを追加</h2>

      <form id="bookmark-form" style="display:contents;">
        <input type="url" id="input-url" placeholder="URL（必須）" required>
        <input type="text" id="input-title" placeholder="タイトル">
        <input type="text" id="input-author" placeholder="著者">
        <textarea id="input-excerpt" placeholder="メモ・抜粋" rows="3"></textarea>

        <!-- タグ入力エリア（オートコンプリート方式） -->
        <div class="tag-input-area" id="tag-input-area" onclick="document.getElementById('tag-input').focus()">
          <input type="text" id="tag-input" placeholder="タグを入力..." autocomplete="off">
          <div class="tag-dropdown" id="tag-dropdown" style="display:none;"></div>
        </div>

        <div class="modal-actions">
          <button type="submit" id="modal-submit-btn">登録</button>
          <button type="button" class="btn-cancel" onclick="closeModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== タグ管理モーダル ===== -->
  <div id="tag-manager-overlay" onclick="onTagManagerOverlayClick(event)">
    <div id="tag-manager-box">
      <h2>タグ管理</h2>
      <p>未使用タグも含めて表示しています。</p>
      <div id="tag-manager-list"></div>
      <button type="button" class="btn-cancel" onclick="closeTagManager()">閉じる</button>
    </div>
  </div>

  <!-- アプリのJavaScript -->
  <script src="/js/app.js"></script>
</body>
</html>
